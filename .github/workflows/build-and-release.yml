name: Build and Release Firmware

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  PLATFORMIO_LIB_DIR: ${{ github.workspace }}/lib

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Update version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Building version: $VERSION"
          TODAY=$(date +'%d.%m.%Y')
          VER_FILE="include/firmware_version.h"
          sed -i "s/FIRMWARE_APP_VERSION \"[^\"]*\"/FIRMWARE_APP_VERSION \"$VERSION\"/" "$VER_FILE"
          sed -i "s/FIRMWARE_APP_DATE \"[^\"]*\"/FIRMWARE_APP_DATE \"$TODAY\"/" "$VER_FILE"
          cat "$VER_FILE"

      - name: Clean src/ui *.bin files
        run: |
          find src/ui -name "*.bin" -type f -delete 2>/dev/null || true

      - name: Convert PNGs to LVGL binaries
        run: python tools/png_to_lvgl8_bin.py

      - name: Build filesystem image
        run: pio run -t buildfs -e esp32-s3-viewe

      - name: Build firmware
        run: pio run -e esp32-s3-viewe

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          # Firmware binary
          cp .pio/build/esp32-s3-viewe/firmware.bin artifacts/
          # Filesystem binary
          cp .pio/build/esp32-s3-viewe/*.bin artifacts/ 2>/dev/null || true
          # Rename filesystem image if present
          if [ -f .pio/build/esp32-s3-viewe/littlefs.bin ]; then
            cp .pio/build/esp32-s3-viewe/littlefs.bin artifacts/filesystem.bin
          elif [ -f .pio/build/esp32-s3-viewe/fatfs.bin ]; then
            cp .pio/build/esp32-s3-viewe/fatfs.bin artifacts/filesystem.bin
          fi
          ls -la artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: artifacts/*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
